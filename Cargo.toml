[package]
name = "rust-fzf"
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["dark0dex"]
description = "A fast terminal fuzzy file finder with live syntax-highlighted previews, multi-select and shell command execution"
repository = "https://github.com/CtxtArc/rfzf"
readme = "README.md"
keywords = ["fuzzy", "finder", "tui", "cli", "fzf"]
categories = ["command-line-utilities"]

[[bin]]
name = "rfzf"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
crossterm = "0.29.0"
ignore = "0.4.25"
nucleo = "0.5.0"
ratatui = "0.30.0"
syntect = "5.3.0"
walkdir = "2.5.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true
